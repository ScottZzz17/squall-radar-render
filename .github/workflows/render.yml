name: render-hrrr

# HRRR publishes hourly, but a 1–18 h forecast barely shifts hour-to-hour, so
# rendering every 2 h keeps R2 writes comfortably inside the free tier (~2.5k
# tiles/run × 12/day ≈ 0.9M/month vs the 1M free cap). Near-term freshness comes
# from RainViewer's nowcast + live observed radar, not this. Bump to hourly only
# if you drop ZOOM_MAX to 5 (see README budget note).
on:
  schedule:
    - cron: "20 */2 * * *" # every 2 h at :20 UTC
  workflow_dispatch: {}     # manual "Run workflow" button

# One run at a time; cancel an overlapping older run.
concurrency:
  group: render-hrrr
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run render
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

