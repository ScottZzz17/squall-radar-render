name: render-mrms

# Observed radar: newest NOAA MRMS composite → R2 every ~10 min (public repo,
# so Actions minutes are free; GitHub may delay schedules a few minutes —
# the Worker falls back to IEM if the manifest is over 15 min old).
# Triggered only by the squall-push Worker (4×/hour). A GitHub schedule here
# as well doubled the runs — and the R2 writes — which pushed the account
# past R2's 1M free Class A operations and onto a $4.50 bill.
on:
  workflow_dispatch: {}

concurrency:
  group: render-mrms
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run mrms
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Ireland + UK observed radar (EUMETNET OPERA). Independent of MRMS.
      - run: npm run opera
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
