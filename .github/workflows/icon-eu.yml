name: render-icon-eu

# Europe (Ireland + UK) forecast radar, temperature and wind from DWD ICON-EU.
# A run lands ~3 h after its time; render every 3 h. Also dispatched by the
# Worker cron, since GitHub's own schedule can lag.
on:
  # Dispatched by the Worker every 6 h (R2 free-tier writes); manual too.
  workflow_dispatch: {}

concurrency:
  group: render-icon-eu
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install eccodes eccodeslib numpy pillow boto3
      - run: python icon_eu.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
